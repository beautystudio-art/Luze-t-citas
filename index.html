<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luze-t | Agenda de citas</title><style>
:root{font-family:system-ui,Arial;background:#fff8fa;color:#452334}body{margin:0}header{background:#77364f;color:white;padding:22px;text-align:center}main{max-width:650px;margin:auto;padding:18px}h1{margin:0}form,.panel{background:white;border:1px solid #ead9df;border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #0001}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;border-radius:8px;border:1px solid #cdb4bf;font:inherit}button{background:#77364f;color:white;border:0;margin-top:12px;cursor:pointer}.delete{background:#a63e50;width:auto;padding:7px 12px}.item{border-bottom:1px solid #eee;padding:12px 0}.muted{color:#775d68;font-size:13px}.toolbar{display:flex;gap:8px}.toolbar button{flex:1}#download{background:#536d56}
</style></head><body><header><h1>Luze-t</h1><div>Agenda de citas · Versión de prueba</div></header><main><p class="muted">Las citas se guardan únicamente en este navegador y dispositivo. No se sincronizan con otros teléfonos.</p><form id="form"><h2>Nueva cita</h2><label for="cliente">Nombre de la clienta</label><input id="cliente" required maxlength="100"><label for="telefono">Teléfono (opcional)</label><input id="telefono" type="tel"><label for="servicio">Servicio</label><select id="servicio"><option>Uñas</option><option>Microblading</option><option>Micropigmentación</option><option>Keratina</option><option>Cejas</option><option>Otro</option></select><label for="fecha">Fecha y hora</label><input id="fecha" type="datetime-local" required><label for="notas">Notas</label><textarea id="notas" rows="2"></textarea><button type="submit">Guardar cita</button></form><section class="panel"><h2>Citas guardadas</h2><div class="toolbar"><button id="download" type="button">Exportar respaldo CSV</button></div><div id="lista"></div></section></main><script>
const key='luze_t_citas_v1';const $=id=>document.getElementById(id);let citas=[];try{citas=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(citas))citas=[]}catch(e){citas=[]}
function save(){localStorage.setItem(key,JSON.stringify(citas));render()}
function render(){const lista=$('lista');lista.replaceChildren();if(!citas.length){lista.textContent='Todavía no hay citas.';return}citas.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(c=>{const item=document.createElement('div');item.className='item';const strong=document.createElement('strong');strong.textContent=c.cliente+' — '+c.servicio;item.append(strong);const p=document.createElement('p');p.textContent=new Date(c.fecha).toLocaleString('es-MX')+(c.telefono?' · '+c.telefono:'')+(c.notas?' · '+c.notas:'');item.append(p);const btn=document.createElement('button');btn.className='delete';btn.textContent='Eliminar';btn.onclick=()=>{if(confirm('¿Eliminar esta cita?')){citas=citas.filter(x=>x.id!==c.id);save()}};item.append(btn);lista.append(item)})}
$('form').onsubmit=e=>{e.preventDefault();citas.push({id:Date.now()+'-'+Math.random(),cliente:$('cliente').value.trim(),telefono:$('telefono').value.trim(),servicio:$('servicio').value,fecha:$('fecha').value,notas:$('notas').value.trim()});save();e.target.reset();alert('Cita guardada')};
$('download').onclick=()=>{const rows=[['Clienta','Telefono','Servicio','Fecha','Notas'],...citas.map(c=>[c.cliente,c.telefono,c.servicio,c.fecha,c.notas])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='luze-t-citas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
